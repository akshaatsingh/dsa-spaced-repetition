<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Spaced Repetition</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <h1>DSA Spaced Repetition</h1>
    <span id="due-count" class="badge" aria-label="Due count"></span>
    <button id="fill-tab" class="btn">Fill Current Tab</button>
  </header>

  <section class="add-problem">
    <h2>Add Problem</h2>
    <form id="add-form">
      <label>Title <input type="text" id="title" required /></label>
      <label>Topic <input type="text" id="topic" /></label>
      <label>Difficulty
        <select id="difficulty">
          <option>Easy</option>
          <option>Medium</option>
          <option>Hard</option>
        </select>
      </label>
      <label>URL <input type="url" id="url" /></label>
      <button type="submit" class="btn">Add</button>
    </form>
  </section>

  <section class="due-section">
    <h2>Due for Review (<span id="due-list-count">0</span>)</h2>
    <select id="topic-filter" class="badge" style="margin-left:8px;">
      <option>All Topics</option>
    </select>
    <ul id="due-list" class="problem-list"></ul>
  </section>

  <section class="upcoming-section">
    <h2>Upcoming Queue</h2>
    <ul id="upcoming-list" class="problem-list"></ul>
  </section>

  <section class="io-section">
    <button id="export" class="btn">Export JSON</button>
    <button id="import" class="btn">Import JSON</button>
    <input type="file" id="import-file" accept=".json" style="display:none"/>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
